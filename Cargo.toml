[package]
name = "mifw_winui"
version = "0.1.0"
edition = "2024"

[build-dependencies]
embed-resource = "3"

[dependencies]
windows-reactor = "0.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "http2"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
